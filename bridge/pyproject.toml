[project]
name = "sierra-bridge"
version = "0.1.0"
description = "OpenAI-compatible HTTP bridge that fronts CLI, Pi, Hermes and other agents for the Sierra Auto app."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
sierra-bridge = "sierra_bridge.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sierra_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

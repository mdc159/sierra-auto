# Manual upload of a signed release to the Google Play internal testing track.
#
# Why: Android Auto only lists Car App Library apps whose install record points at
# Google Play. A build that the phone installs from Play keeps that record on every
# update, with no PC involved. See docs/UPDATES.md for the one-time Play Console setup.
#
# Needs these repository secrets. Missing secrets fail the deployment with a summary.
#   PLAY_SERVICE_ACCOUNT_JSON   the service account key (JSON text) invited in Play Console
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
#                               the same release key build.yml uses (it is the Play upload key)
#
# Signing key, read before the first run: the first upload enrols the app in Play App
# Signing. At that enrolment choose "Use an existing key" and upload the release key from
# SIGNING_KEYSTORE_BASE64 with Google's PEPK tool (docs/UPDATES.md, section 4, step 3).
# Otherwise Play re-signs with its own key, and a Play install and a GitHub Release
# install can never update each other (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
#
# versionCode is explicitly selected above the uploaded and installed maximum. GitHub builds use the
# separate build run number. Check both channels before deployment; the in-app
# updater never offers a downgrade. Play requires a strictly increasing versionCode.

name: play

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unused Play version code, greater than every uploaded or installed build (last recorded phone: 100009)'
        required: true
        type: string
      status:
        description: "Play release status: completed goes live for internal testers at once, draft waits in the console"
        type: choice
        default: completed
        options: [completed, draft]
      release_name:
        description: "Optional release name shown in Play Console (defaults to the versionCode)"
        type: string
        default: ""

concurrency:
  group: play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require staging and an explicit version code
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test "$GITHUB_REF" = refs/heads/staging || { echo '::error::Deploy Play internal testing from staging only'; exit 1; }
          [[ "$REQUESTED_VERSION_CODE" =~ ^[1-9][0-9]{5,9}$ ]] || { echo '::error::Invalid version code'; exit 1; }
          (( REQUESTED_VERSION_CODE > 100009 && REQUESTED_VERSION_CODE <= 2100000000 )) || { echo '::error::Version code must exceed 100009 and fit the Play limit'; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan source history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Validate Android and Play release manifest
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug lintRelease -Pplay=true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Validate bridge
        working-directory: bridge
        run: |
          uv sync --locked
          uv run --locked pytest -q
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-validation
          path: |
            app/build/reports/
            app/build/test-results/
  play:
    if: github.ref == 'refs/heads/staging'
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        id: secrets
        env:
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD != '' }}
        run: |
          missing=""
          [ "$HAS_PLAY" = "true" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          [ "$HAS_KEYSTORE" = "true" ] || missing="$missing SIGNING_KEYSTORE_BASE64"
          [ "$HAS_STORE_PASSWORD" = "true" ] || missing="$missing SIGNING_STORE_PASSWORD"
          [ "$HAS_KEY_ALIAS" = "true" ] || missing="$missing SIGNING_KEY_ALIAS"
          [ "$HAS_KEY_PASSWORD" = "true" ] || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            msg="Play upload skipped: missing repository secret(s):$missing. See docs/UPDATES.md and docs/DEVELOPMENT-WORKFLOW.md."
            echo "::error title=Play upload blocked::$msg"
            {
              echo "### Play upload skipped"
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-java@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        if: steps.secrets.outputs.ready == 'true'

      - name: Decode release keystore
        if: steps.secrets.outputs.ready == 'true'
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "PLAY_VERSION_CODE=$REQUESTED_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        if: steps.secrets.outputs.ready == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon bundleRelease -PversionCode="$PLAY_VERSION_CODE" -Pplay=true
          cp app/build/outputs/bundle/release/app-release.aab sierra-auto.aab
          # Play needs an App Bundle for every track of an app created after August 2021.
          # Prove the bundle carries the release certificate, not the debug one.
          keytool -printcert -jarfile sierra-auto.aab | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::Release bundle is debug-signed."
            exit 1
          fi
          echo "versionCode $PLAY_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Play internal testing
        if: steps.secrets.outputs.ready == 'true'
        # v1.1.5, pinned by commit because this step receives the Play service-account key.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mdc159.sierra
          releaseFiles: sierra-auto.aab
          track: internal
          status: ${{ inputs.status }}
          releaseName: ${{ inputs.release_name != '' && inputs.release_name || format('Sierra Play build {0}', env.PLAY_VERSION_CODE) }}

      - name: Summary
        if: steps.secrets.outputs.ready == 'true'
        run: |
          {
            echo "### Uploaded to Play internal testing"
            echo "versionCode $PLAY_VERSION_CODE, status ${{ inputs.status }}."
            echo "Testers get it from the internal testing opt-in link, or from the Play Store update list once it has processed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

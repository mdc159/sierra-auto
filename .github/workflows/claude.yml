# M5 idea loop: an issue labeled `idea` (or any @claude mention) runs a cloud
# Claude Code agent. The agent implements the change on a claude/... branch and
# opens a PR. build.yml then builds the PR, and merging to main publishes the
# APK release.
#
# Auth: Claude subscription OAuth token (secret CLAUDE_CODE_OAUTH_TOKEN, made
# with `claude setup-token`). There is deliberately no ANTHROPIC_API_KEY path.
# If the secret is missing, the job logs a warning and skips. It does not fail.
#
# Action docs: https://github.com/anthropics/claude-code-action (docs/usage.md, docs/setup.md)
# See docs/IDEA-LOOP.md for the owner's setup steps.

name: claude

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run at a time per issue or PR. `queue: max` keeps every pending request
# (up to 100) instead of letting a newer one replace an older pending one.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  claude:
    # Only spin up a runner for real triggers. An issue opened with the `idea`
    # label also fires `labeled`, so skip the `opened` event in that case to
    # avoid running twice.
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'idea') ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
        !contains(github.event.issue.labels.*.name, 'idea') &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # required by the Claude GitHub App auth path
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN and refuse fork PRs
        id: auth
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          # The agent runs ./gradlew from the checked-out branch with secrets in
          # scope, so never run it on a PR whose head lives in a fork.
          if [ -n "$PR_NUMBER" ]; then
            head_repo=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name // ""')
            if [ "$head_repo" != "$REPO" ]; then
              msg="PR #$PR_NUMBER comes from a fork ($head_repo), so the idea loop will not run on it."
              echo "::warning title=Idea loop skipped::$msg"
              echo "### Idea loop skipped" >> "$GITHUB_STEP_SUMMARY"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            msg="CLAUDE_CODE_OAUTH_TOKEN secret is not set, so the idea loop is skipped. Run 'claude setup-token' and add the token as a repository secret (see docs/IDEA-LOOP.md)."
            echo "::warning title=Idea loop skipped::$msg"
            echo "### Idea loop skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17 (so Claude can run Gradle)
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Claude Code
        if: steps.auth.outputs.ready == 'true'
        # v1.0.268 (same commit as the floating v1 tag on 2026-11-04)
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: idea
          trigger_phrase: "@claude"
          base_branch: main
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(./gradlew:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*)"
            --append-system-prompt 'You are working on Sierra Auto, a personal sideloaded Android Auto app written in Kotlin with the Android for Cars App Library, in the point-of-interest category.

            Before doing anything else, read docs/PLAN.md and docs/android-auto-constraints.md in full.

            For a feature request, answer every question in the Feature idea checklist of docs/android-auto-constraints.md. If the idea breaks a constraint, such as keyboard input while driving, more than 5 templates in a task, video or animation, or templates the POI category cannot use, do not implement it. Explain why in your comment and suggest a version that fits.

            Rules:
            - Never push to main. Work only on the branch the action created for you.
            - Keep the change small and focused on the issue.
            - Before pushing, run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
              and fix any failure.
            - Never commit secrets, keystores, API keys or tokens. The repository is public.
            - You cannot edit files under .github/workflows. If the idea needs that, say so.
            - If you were triggered from an issue: when your commits are pushed, open a pull request against main with gh pr create, using --base main and --head set to your branch. Write a clear title, and a body that summarizes the change, lists the checklist answers, and says Closes #ISSUE with the real issue number. Then put the PR link in your comment.
            - If you were triggered from an existing pull request: push to that PR branch only. Do not run gh pr create and do not open a second PR.'
